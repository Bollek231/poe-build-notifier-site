name: Package PoE Build Notifier

on:
  push:
    paths:
      - 'bot/**'
      - 'VERSION'
      - '.github/workflows/package-bot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build the downloadable bot ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("bot")
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          target = Path("downloads") / f"PoE_Build_Notifier_v{version}.zip"
          target.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(target, "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  if any(part in ("__pycache__", "backups", ".venv") for part in path.parts):
                      continue
                  if path.name == ".env" or path.suffix in (".pyc", ".sqlite3"):
                      continue
                  archive.write(path, path.relative_to(root).as_posix())
          print(f"{target}: {target.stat().st_size} bytes")
          PY
      - name: Commit ZIP download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "downloads/PoE_Build_Notifier_v$(cat VERSION).zip"
          if ! git diff --cached --quiet; then
            git commit -m "build: downloadable PoE Build Notifier v$(cat VERSION)"
            git push
          fi
